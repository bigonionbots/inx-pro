; Firmware for the external audio module: an M5Stack ATOM Lite (ESP32-PICO-D4) plugged into
; the LilyGo T5's USB-C port. Separate PlatformIO project; build from this folder:
;   cd audio-module && pio run -t upload
;
; atom_lite is the module: it plays audio the T5 streams over the link (shared/audio_link/) to
; Bluetooth A2DP headphones, a PCM5102A on I2S, or a null sink. The atom_* diagnostic envs are the
; stage-2 link tests (src/LinkDiag.cpp); the T5's Audio Module -> Link test needs atom_linkdiag.
;
; Same platform and Arduino core as the main firmware (pioarduino, arduino-esp32 3.3.7).
;
; BRIDGE: this ATOM Lite's USB serial is an FTDI emulation ("Hades2001" / "M5stack",
; 0403:6001, bcdDevice 5.00), not an FTDI chip. Measured from a Linux host (docs/audio-module.md):
; 921600 and 1M come out garbled, 500k/750k/1.5M are bit-clean; host -> module is reliable at
; 10-17 KB/s; module -> host drops data unless trickled (16-byte bursts every 4 ms).
[platformio]
default_envs = atom_lite

[env:atom_lite]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.37/platform-espressif32.zip
platform_packages =
  framework-arduinoespressif32 @ https://github.com/espressif/arduino-esp32/releases/download/3.3.7/esp32-core-3.3.7.tar.xz
framework = arduino
board = m5stack-atom
; 3 MB app, no OTA: Bluetooth Classic + both decoders do not fit the default 1.25 MB slot.
board_build.partitions = huge_app.csv
upload_speed = 1500000
monitor_speed = 500000
build_flags =
  -I../shared/audio_link
  ; Must match INX_AUDIO_MODULE_BAUD in the main platformio.ini.
  -DAUDIO_MODULE_BAUD=500000
  ; No HE-AAC (SBR): its 51 KB state does not fit next to Bluetooth Classic on this PSRAM-less
  ; ESP32 (docs/audio-module.md). HE-AAC files play as their AAC-LC core. lib/libhelix is a
  ; vendored, patched codec-helix (lib/libhelix/PATCHES.md).
  -DHELIX_NO_AAC_SBR
  -DHELIX_LOGGING_ACTIVE=false
build_src_filter = +<*>
lib_deps =
  https://github.com/pschatzmann/ESP32-A2DP.git#v1.8.11

; One-direction link test, driven by the T5's Audio Module -> Link test or tools/link_diag.py.
[env:atom_linkdiag]
extends = env:atom_lite
build_flags =
  -I../shared/audio_link
  -DAUDIO_MODULE_BAUD=500000
  -DAUDIO_MODULE_DIAG_MODE=3
lib_deps =
lib_ignore = libhelix
build_src_filter = -<*> +<main.cpp> +<LinkDiag.cpp>

; Plain echo, for tools/echo_test.py from a PC.
[env:atom_echo]
extends = env:atom_lite
build_flags =
  -I../shared/audio_link
  -DAUDIO_MODULE_BAUD=500000
  -DAUDIO_MODULE_DIAG_MODE=1
lib_deps =
lib_ignore = libhelix
build_src_filter = -<*> +<main.cpp> +<LinkDiag.cpp>

; Experiments at any baud rate: AUDIO_MODULE_BAUD=750000 pio run -e atom_diag -t upload
[env:atom_diag]
extends = env:atom_lite
build_flags =
  -I../shared/audio_link
  -DAUDIO_MODULE_BAUD=${sysenv.AUDIO_MODULE_BAUD}
  -DAUDIO_MODULE_DIAG_MODE=3
lib_deps =
lib_ignore = libhelix
build_src_filter = -<*> +<main.cpp> +<LinkDiag.cpp>

; Transmit-only text beacon at any baud rate, to find the real transmit rate from the PC.
[env:atom_beacon]
extends = env:atom_lite
build_flags =
  -I../shared/audio_link
  -DAUDIO_MODULE_BAUD=${sysenv.AUDIO_MODULE_BAUD}
  -DAUDIO_MODULE_DIAG_MODE=2
lib_deps =
lib_ignore = libhelix
build_src_filter = -<*> +<main.cpp> +<LinkDiag.cpp>
